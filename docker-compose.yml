name: berater-cockpit

services:
  cockpit-web:
    build: { context: ., dockerfile: web/Dockerfile }
    container_name: cockpit-web          # unter diesem Namen erreicht der zentrale Caddy das Cockpit
    restart: unless-stopped
    environment:
      COCKPIT_USER: ${COCKPIT_USER}
      COCKPIT_PASS_HASH: ${COCKPIT_PASS_HASH}
    networks: [default, cockpit-proxy]   # kein eigener Port nach außen; Zugriff nur über den zentralen Caddy
    depends_on: [cockpit-api]

  cockpit-api:
    build: { context: ./backend, args: { COCKPIT_COMMIT: "${COCKPIT_COMMIT:-unbekannt}" } }   # Versionsanzeige; scripts/bauen.sh setzt den Commit
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cockpit:${DB_PASSWORD}@cockpit-db:5432/cockpit
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY fehlt in der .env}   # Sitzungen und Verschlüsselung des 2FA-Geheimnisses
      ZWEI_FAKTOR_PFLICHT: ${ZWEI_FAKTOR_PFLICHT:-true}         # nur in der Entwicklung false
      GENERATOR_URL: http://cockpit-generator:3000
      PDF_URL: http://cockpit-pdf:3100            # Vorschau Schnellweg INIT (Phase 2h)
      # KI-Textvorschläge (Phase 2b): Standard AUS. Erst einschalten, wenn API-Bedingungen und AVV vorliegen und der
      # Geschäftsführer freigegeben hat (CLAUDE.md). Schlüssel nur in der .env, nie im Repository.
      KI_AKTIV: ${KI_AKTIV:-false}
      BEISPIELDATEN_AKTIV: ${BEISPIELDATEN_AKTIV:-true}
      KI_ANBIETER: ${KI_ANBIETER:-anthropic}
      KI_MODELL: ${KI_MODELL:-claude-sonnet-5-5}
      CHECKLISTE_MODELL: ${CHECKLISTE_MODELL:-claude-sonnet-5-5}   # Checkliste einlesen (Phase 2g, Foto/PDF)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Wöchentliche Förderprüfung (Phase 2f): nur Förderwerte gehen an die KI, daher eigener Schalter. Standard AUS.
      FOERDERPRUEFUNG_AKTIV: ${FOERDERPRUEFUNG_AKTIV:-false}
      FOERDERPRUEFUNG_MODELL: ${FOERDERPRUEFUNG_MODELL:-claude-opus-5-5}          # gründliche Prüfung (Stufe 2)
      FOERDERPRUEFUNG_VOR_MODELL: ${FOERDERPRUEFUNG_VOR_MODELL:-claude-sonnet-5-5}  # Vorprüfung (Stufe 1)
      FOERDERPRUEFUNG_MAX_SUCHEN: ${FOERDERPRUEFUNG_MAX_SUCHEN:-12}
      FOERDERPRUEFUNG_MAX_ABRUFE: ${FOERDERPRUEFUNG_MAX_ABRUFE:-5}
      FOERDERPRUEFUNG_VOR_SUCHEN: ${FOERDERPRUEFUNG_VOR_SUCHEN:-8}
      FOERDERPRUEFUNG_INTERVALL_TAGE: ${FOERDERPRUEFUNG_INTERVALL_TAGE:-14}
      FOERDERPRUEFUNG_MAX_LAEUFE_TAG: ${FOERDERPRUEFUNG_MAX_LAEUFE_TAG:-5}
      # E-Mail-Benachrichtigungen (Phase 2f). Zugangsdaten nur in der .env.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORT: ${SMTP_PASSWORT:-}
      SMTP_ABSENDER: ${SMTP_ABSENDER:-}
      SMTP_NUR_PROTOKOLL: ${SMTP_NUR_PROTOKOLL:-false}
      SMTP_UMLEITUNG_AN: ${SMTP_UMLEITUNG_AN:-}
      SMTP_BETREFF_PRAEFIX: ${SMTP_BETREFF_PRAEFIX:-}
      COCKPIT_URL: ${COCKPIT_URL:-https://cockpit.mybase-test.de}
    networks: [default, cockpit-intern]
    depends_on:
      cockpit-db: { condition: service_healthy }   # Migrationen laufen beim Start der API
    volumes:
      - datei-daten:/daten   # hochgeladene Unterlagen – eigenes Volume, nicht im Web-Verzeichnis

  cockpit-generator:   # Word-Berichte im CI (generator/README.md); Tests laufen beim Bauen
    build: { context: ./generator }
    restart: unless-stopped
    networks: [cockpit-intern]   # nur internes Netz: kein Port, kein Internet, nicht in cockpit-proxy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  cockpit-pdf:   # Word → PDF für die Vorschau im Schnellweg INIT (Phase 2h); LibreOffice headless, eine Umwandlung gleichzeitig
    build: { context: ./pdf }
    restart: unless-stopped
    networks: [cockpit-intern]   # nur internes Netz: kein Port, kein Internet
    read_only: true
    tmpfs: ["/tmp:size=512m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3100/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  cockpit-db:   # Benutzer, Sitzungen, Protokoll, Projekte, Berichte, Datei-Metadaten (Inhalte im Volume datei-daten)
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cockpit
      POSTGRES_USER: cockpit
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-daten:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cockpit -d cockpit"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Nur Variante B: Server hat noch keinen Reverse Proxy -> dieser Caddy holt das TLS-Zertifikat
  proxy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./web/Caddyfile.tls:/etc/caddy/Caddyfile:ro
      - caddy-daten:/data
    depends_on: [cockpit-web]

networks:
  cockpit-proxy:
    external: true     # vorher anlegen: docker network create cockpit-proxy
  cockpit-intern:
    internal: true     # API <-> Generator, ohne Verbindung nach außen

volumes:
  db-daten:
  datei-daten:
  caddy-daten:
