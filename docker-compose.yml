name: berater-cockpit

services:
  cockpit-web:
    build: { context: ., dockerfile: web/Dockerfile }
    container_name: cockpit-web          # unter diesem Namen erreicht der zentrale Caddy das Cockpit
    restart: unless-stopped
    environment:
      COCKPIT_USER: ${COCKPIT_USER}
      COCKPIT_PASS_HASH: ${COCKPIT_PASS_HASH}
    networks: [default, cockpit-proxy]   # kein eigener Port nach außen; Zugriff nur über den zentralen Caddy
    depends_on: [cockpit-api]

  cockpit-api:
    build: { context: ./backend }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cockpit:${DB_PASSWORD}@cockpit-db:5432/cockpit
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY fehlt in der .env}   # Sitzungen und Verschlüsselung des 2FA-Geheimnisses
      ZWEI_FAKTOR_PFLICHT: ${ZWEI_FAKTOR_PFLICHT:-true}         # nur in der Entwicklung false
    depends_on:
      cockpit-db: { condition: service_healthy }   # Migrationen laufen beim Start der API

  cockpit-db:   # Benutzer, Sitzungen, Protokoll; ab Phase 1 auch Projekte und Konditionen-Versionen
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cockpit
      POSTGRES_USER: cockpit
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-daten:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cockpit -d cockpit"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Nur Variante B: Server hat noch keinen Reverse Proxy -> dieser Caddy holt das TLS-Zertifikat
  proxy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./web/Caddyfile.tls:/etc/caddy/Caddyfile:ro
      - caddy-daten:/data
    depends_on: [cockpit-web]

networks:
  cockpit-proxy:
    external: true     # vorher anlegen: docker network create cockpit-proxy

volumes:
  db-daten:
  caddy-daten:
